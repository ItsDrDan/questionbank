name: Rebuild question bank from the games
# Runs when you press "Run workflow" on the Actions tab, and every night.
# It copies the latest question lists out of every game into bank/ and data/.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'   # about 2-3 AM Pacific
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: questionbank }
      - name: Get the games
        # textbook: its js/fbx.js draws the molecules in stereochemistry and pHcharge (tools/sampler-kit.js loads it)
        run: |
          mkdir games && cd games
          for r in sigfig metric elements polyatomic ionicformula moles stoichiometry gaslaws thermochemistry reactions redox quantumchemistry lewisstructures chem1bready algebratrainer functionalgroups organicreactions organic carbohydrates finalexam aminoacids enzymes lipids nucleicacids metabolism stereochemistry pHcharge bondingtheories textbook; do
            git clone --depth 1 https://github.com/ItsDrDan/$r.git
          done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: |
          cd questionbank
          npm init -y >/dev/null && npm install playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node tools/build.js ../games || echo 'SAMPLER_FAILED=1' >> $GITHUB_ENV
      - name: Save changes
        run: |
          cd questionbank
          git config user.name "question-bank-bot"; git config user.email "actions@github.com"
          git add bank data index.json whys.js
          git diff --cached --quiet || (git commit -m "Rebuild question bank from games" && git push)
      - name: Flag sampler problems
        if: env.SAMPLER_FAILED == '1'
        run: |
          echo 'A game changed and its sampler needs updating. Its previous questions were kept. See the Build step log.'
          exit 1
